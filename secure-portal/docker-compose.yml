services:
  postgres:
    image: postgres:17.5-alpine3.22
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
    volumes:
      - portal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.0.3-alpine3.21
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.1
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PUBLIC_ORIGIN: http://localhost:4100
      DATABASE_URL: postgresql://portal:portal_dev_password@postgres:5432/portal
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_PROVIDER: smtp
    command: ["sh", "-c", "npm run db:migrate:prod --workspace @bitwise-portal/api && npm run db:seed:prod --workspace @bitwise-portal/api && npm run start --workspace @bitwise-portal/api"]
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - portal-files:/app/data/private-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  portal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://portal:portal_dev_password@postgres:5432/portal
      REDIS_URL: redis://redis:6379
      STORAGE_MODE: local
      LOCAL_STORAGE_PATH: /app/data/private-files
      SCANNER_MODE: stub
      EMAIL_PROVIDER: smtp
    command: ["npm", "run", "worker", "--workspace", "@bitwise-portal/api"]
    volumes:
      - portal-files:/app/data/private-files
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_started
    restart: unless-stopped

volumes:
  portal-postgres:
  portal-files:
