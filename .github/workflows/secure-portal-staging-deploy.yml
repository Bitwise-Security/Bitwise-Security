name: Deploy secure portal staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-portal-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: secure-portal-staging
    defaults:
      run:
        working-directory: secure-portal
    env:
      CLOUDFLARE_ACCOUNT_ID: "6931a6facc4105d469f43215d2c3fb23"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: secure-portal/package-lock.json
      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PORTAL_STAGING_MFA_ENCRYPTION_KEY: ${{ secrets.PORTAL_STAGING_MFA_ENCRYPTION_KEY }}
          PORTAL_STAGING_SESSION_PEPPER: ${{ secrets.PORTAL_STAGING_SESSION_PEPPER }}
          PORTAL_STAGING_FILE_KEY_RING: ${{ secrets.PORTAL_STAGING_FILE_KEY_RING }}
          PORTAL_STAGING_RESEND_API_KEY: ${{ secrets.PORTAL_STAGING_RESEND_API_KEY }}
          PORTAL_STAGING_ADMIN_EMAIL: ${{ secrets.PORTAL_STAGING_ADMIN_EMAIL }}
          PORTAL_STAGING_ADMIN_PASSWORD: ${{ secrets.PORTAL_STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_API_TOKEN \
            PORTAL_STAGING_MFA_ENCRYPTION_KEY PORTAL_STAGING_SESSION_PEPPER \
            PORTAL_STAGING_FILE_KEY_RING PORTAL_STAGING_RESEND_API_KEY \
            PORTAL_STAGING_ADMIN_EMAIL PORTAL_STAGING_ADMIN_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "Required staging secret is missing: ${name}" >&2
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run cf:types
      - run: git diff --exit-code -- apps/edge/worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Build the production container before changing Cloudflare
        run: docker build --file Dockerfile.cloudflare --tag bitwise-secure-portal-staging:${{ github.sha }} .
      - name: Verify the exact dedicated R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket info bitwise-secure-portal-staging-files --config apps/edge/wrangler.staging.jsonc
      - name: Verify the exact dedicated D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 info bitwise-secure-portal-staging-db --config apps/edge/wrangler.staging.jsonc
      - name: Apply D1 migrations to only the portal staging database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:staging
      - name: Create only the unreachable staging Worker shell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:bootstrap:staging
      - name: Store runtime secrets on only the staging Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PORTAL_STAGING_MFA_ENCRYPTION_KEY: ${{ secrets.PORTAL_STAGING_MFA_ENCRYPTION_KEY }}
          PORTAL_STAGING_SESSION_PEPPER: ${{ secrets.PORTAL_STAGING_SESSION_PEPPER }}
          PORTAL_STAGING_FILE_KEY_RING: ${{ secrets.PORTAL_STAGING_FILE_KEY_RING }}
          PORTAL_STAGING_RESEND_API_KEY: ${{ secrets.PORTAL_STAGING_RESEND_API_KEY }}
          PORTAL_STAGING_ADMIN_EMAIL: ${{ secrets.PORTAL_STAGING_ADMIN_EMAIL }}
          PORTAL_STAGING_ADMIN_PASSWORD: ${{ secrets.PORTAL_STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          put_secret() {
            printf '%s' "$2" | npx wrangler secret put "$1" --config apps/edge/wrangler.staging.jsonc
          }
          put_secret MFA_ENCRYPTION_KEY "$PORTAL_STAGING_MFA_ENCRYPTION_KEY"
          put_secret SESSION_PEPPER "$PORTAL_STAGING_SESSION_PEPPER"
          put_secret FILE_KEY_RING "$PORTAL_STAGING_FILE_KEY_RING"
          put_secret RESEND_API_KEY "$PORTAL_STAGING_RESEND_API_KEY"
          put_secret BOOTSTRAP_ADMIN_EMAIL "$PORTAL_STAGING_ADMIN_EMAIL"
          put_secret BOOTSTRAP_ADMIN_PASSWORD "$PORTAL_STAGING_ADMIN_PASSWORD"
      - name: Deploy only the portal staging Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy:staging
      - name: Wait for the private Container to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              --max-time 20 \
              https://portal-test.bitwise-security.nl/api/v1/health \
              | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 15
          done
          echo "Staging health check did not become ready in ten minutes." >&2
          exit 1
      - name: Remove temporary administrator bootstrap credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' '{"BOOTSTRAP_ADMIN_EMAIL":null,"BOOTSTRAP_ADMIN_PASSWORD":null}' \
            | npx wrangler secret bulk --config apps/edge/wrangler.staging.jsonc
      - name: Verify health after bootstrap-secret removal
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --max-time 20 \
              https://portal-test.bitwise-security.nl/api/v1/health \
              | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 15
          done
          echo "Staging health check failed after bootstrap-secret removal." >&2
          exit 1
